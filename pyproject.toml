[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sterile-nu-bbn-server"
version = "0.1.0"
description = "MCP server bridging sterile neutrino particle physics with Big Bang Nucleosynthesis cosmology."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.27,<2", "pydantic>=2,<3"]
dev = ["pytest", "pytest-asyncio"]
notebook = ["jupyter", "ipykernel"]

[tool.mcp-server]
tool_modules = ["tools"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_server*", "tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
